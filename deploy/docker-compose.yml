# Docker Compose configuration for Pharmacy Inventory Management System
services:
  # =============================================================
  # Database Tier: PostgreSQL 16 Alpine
  # Protected: Not published to host; accessible only within pharmacy_network
  # =============================================================
  db:
    image: postgres:16-alpine
    container_name: pharmacy_db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmacy_db}
      POSTGRES_USER: ${POSTGRES_USER:-pharmacy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharmacy_secure_password_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pharmacy_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pharmacy_user} -d ${POSTGRES_DB:-pharmacy_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - pharmacy_network

  # =============================================================
  # Application API Tier: Node.js 22 LTS + Express
  # Protected: Not published to host; accessible only through Caddy reverse proxy
  # =============================================================
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        APP_VERSION: 1.0.0
        GIT_SHA: compose
    image: ${API_IMAGE:-pharmacy-api:${IMAGE_TAG:-latest}}
    container_name: pharmacy_api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SEED_ON_START: ${SEED_ON_START:-true}
      DATABASE_URL: postgres://${POSTGRES_USER:-pharmacy_user}:${POSTGRES_PASSWORD:-pharmacy_secure_password_2026}@db:5432/${POSTGRES_DB:-pharmacy_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pharmacy_db}
      POSTGRES_USER: ${POSTGRES_USER:-pharmacy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharmacy_secure_password_2026}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pharmacy_network

  # =============================================================
  # Web & Ingress Tier: Caddy 2.8 Reverse Proxy & HTTPS
  # Gateway: The ONLY service that publishes ports to the host (80 and 443)
  # =============================================================
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: ${WEB_IMAGE:-pharmacy-web:${IMAGE_TAG:-latest}}
    container_name: pharmacy_web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      API_HOST: api
      API_PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - pharmacy_network

# =============================================================
# Persistent Storage Volumes
# Ensures database records and TLS certificate state persist across restarts
# =============================================================
volumes:
  pharmacy_pg_data:
    name: pharmacy_pg_data
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config

# =============================================================
# Isolated Internal Network
# =============================================================
networks:
  pharmacy_network:
    name: pharmacy_network
    driver: bridge
