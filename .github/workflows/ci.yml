name: Continuous Integration & Delivery (CI/CD)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # =============================================================
  # 1. Code Quality: Linting & Prettier Formatting
  # =============================================================
  lint-and-format:
    name: Lint & Format Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS (Backend)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Verify backend linting
        run: cd backend && npm run lint

      - name: Verify backend formatting
        run: cd backend && npm run format:check

      - name: Setup Node.js 22 LTS (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Verify frontend linting
        run: cd frontend && npm run lint

      - name: Verify frontend formatting
        run: cd frontend && npm run format:check

  # =============================================================
  # 2. Automated Backend Tests with PostgreSQL Service
  # =============================================================
  test-backend:
    name: Backend Test Suite (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pharmacy_test_db
          POSTGRES_USER: pharmacy_test_user
          POSTGRES_PASSWORD: pharmacy_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Run database migrations
        env:
          DATABASE_URL: postgres://pharmacy_test_user:pharmacy_test_password@localhost:5432/pharmacy_test_db
        run: cd backend && npx node-pg-migrate up

      - name: Execute automated test suite (Unit, Concurrency, Observability)
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: postgres://pharmacy_test_user:pharmacy_test_password@localhost:5432/pharmacy_test_db
          LOG_LEVEL: fatal
        run: cd backend && npm test

  # =============================================================
  # 3. Frontend Bundle Build Verification
  # =============================================================
  build-frontend:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build frontend static bundle
        run: cd frontend && npm run build

  # =============================================================
  # 4. Container Build, Trivy Security Scan & GHCR Release
  # =============================================================
  build-scan-and-publish:
    name: Container Build, Scan & GHCR Publish
    needs: [lint-and-format, test-backend, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower-case repository reference for GHCR
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata & tags for API container
      - name: Docker metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LOWER }}/pharmacy-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Extract metadata & tags for Web container
      - name: Docker metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LOWER }}/pharmacy-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build API image locally for scanning
      - name: Build API image locally
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: pharmacy-api:scan
          build-args: |
            APP_VERSION=1.0.0
            GIT_SHA=${{ github.sha }}

      # Run Trivy vulnerability scanner on API image
      - name: Run Trivy vulnerability scan on API
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'pharmacy-api:scan'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # Build Web image locally for scanning
      - name: Build Web image locally
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: pharmacy-web:scan

      # Run Trivy vulnerability scanner on Web image
      - name: Run Trivy vulnerability scan on Web
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'pharmacy-web:scan'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # Push API image to GHCR (on push to main or tags)
      - name: Push API image to GHCR
        if: github.event_name != 'pull_request'
        id: push-api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: |
            APP_VERSION=1.0.0
            GIT_SHA=${{ github.sha }}

      # Push Web image to GHCR (on push to main or tags)
      - name: Push Web image to GHCR
        if: github.event_name != 'pull_request'
        id: push-web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

      - name: Output image digests and published tags
        if: github.event_name != 'pull_request'
        env:
          API_TAGS: ${{ steps.meta-api.outputs.tags }}
          API_DIGEST: ${{ steps.push-api.outputs.digest }}
          WEB_TAGS: ${{ steps.meta-web.outputs.tags }}
          WEB_DIGEST: ${{ steps.push-web.outputs.digest }}
        run: |
          echo "=========================================================="
          echo "GHCR Deployment Summary"
          echo "=========================================================="
          echo "API Image: ghcr.io/${{ env.REPO_LOWER }}/pharmacy-api"
          echo "API Tags: ${API_TAGS}"
          echo "API Digest: ${API_DIGEST}"
          echo "----------------------------------------------------------"
          echo "Web Image: ghcr.io/${{ env.REPO_LOWER }}/pharmacy-web"
          echo "Web Tags: ${WEB_TAGS}"
          echo "Web Digest: ${WEB_DIGEST}"
          echo "=========================================================="
